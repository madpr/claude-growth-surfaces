<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who is paying for this session?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* A drivable mock of credential precedence in Claude Code.

   Replicated from the shipped CLI, v2.1.260, 3 September 2026: the custom API
   key dialog and its default focus on "No (recommended)", the fields
   `claude auth status --json` reports in both states, and the layout of /cost.
   Anything this mock adds is marked in the transcript with a faint rule.

   The additions are the status line's billing badge, the displacement note and
   the rebill key. The Proposed precedence is the change argued in
   proposal-credential-precedence.md. Neither ships.

   Every figure comes from prototype/mock-session.json through the arithmetic in
   prototype/statusline-billing.sh. The key is synthetic.

   Single surface, deliberately: this is a terminal, and a terminal is dark on
   any desktop. Every color is painted explicitly so the page holds on either
   host ground. */
:root{
  --term:#111010; --edge:#302B26; --panel:#1A1815; --raise:#231F1B;
  --txt:#E9E5DD; --dim:#7E786D; --faint:#4E4941;
  --ok:#74AE8D; --warn:#DCA646; --stop:#D97757; --blue:#7FA8CE; --new:#E08A66;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--term); color:var(--txt);
  font-family:var(--mono); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--new); outline-offset:2px; border-radius:4px}

/* ---------------- the two controls ---------------- */
.rig{
  flex:none; display:flex; flex-direction:column; gap:8px;
  padding:11px 22px 12px; border-bottom:1px solid var(--edge); background:var(--panel);
}
.ctls{display:flex; flex-wrap:wrap; align-items:center; gap:9px 26px}
.ctl{display:flex; align-items:center; gap:9px; min-width:0}
.ctl .k{
  font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); flex:none;
}
.seg{display:flex; border:1px solid var(--edge); border-radius:7px; overflow:hidden}
.seg button{padding:4px 11px; font-size:12.5px; color:var(--dim); white-space:nowrap}
.seg button:hover{background:var(--raise); color:var(--txt)}
.seg button.on{background:var(--raise); color:var(--txt); font-weight:500}
.seg button.on.alt{color:var(--new)}
.rig .why{
  margin:0; font-size:13px; font-weight:400; color:var(--dim); text-align:left;
  max-width:80ch; line-height:1.5;
}

/* ---------------- the terminal ---------------- */
#screen{position:relative; flex:1; min-height:0; overflow-y:auto; padding:22px 26px 8px; cursor:text}
#inner{max-width:1180px; margin:0 auto}
#out{white-space:pre-wrap; word-break:break-word}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .stop{color:var(--stop)}
.blue{color:var(--blue)} .new{color:var(--new)}
.b{font-weight:700; color:#fff}
#out a{color:var(--new); text-decoration:underline; text-underline-offset:3px}
#out a:hover{color:#fff}

/* Anything the mock adds rather than replicates carries this rule. */
.mn{color:var(--faint); border-left:2px solid var(--edge); padding-left:9px; display:block}

/* The custom API key dialog, as the CLI draws it. */
.dlg{
  border:1px solid var(--warn); border-radius:8px; padding:11px 14px;
  margin:4px 0 4px; max-width:62ch;
}
.dlg .ttl{color:var(--warn); font-weight:700}
.opt{padding-left:2px}
.opt.sel{color:#fff}
.opt.sel .mk{color:var(--new)}
.mk{color:transparent}

/* The status line, pinned where Claude Code renders it. */
#sl{
  flex:none; white-space:pre-wrap; border-top:1px solid var(--edge);
  padding:11px 26px; background:var(--panel);
}
#sl .in{max-width:1180px; margin:0 auto}
#sl .tag{
  float:right; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint);
}

.line{display:flex; gap:8px; align-items:baseline; padding-bottom:14px}
.ps{color:var(--ok); flex:none}
#typed{white-space:pre-wrap; word-break:break-word}
#ghost{color:var(--faint)}
.cur{
  display:inline-block; width:.58em; height:1.1em; background:var(--txt);
  vertical-align:-.18em; animation:bl 1.1s steps(1) infinite;
}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cur{animation:none}}
.hide{display:none}
#kb{
  position:absolute; width:1px; height:1px; opacity:0; padding:0; border:0;
  background:transparent; color:transparent; outline:none; font:inherit;
}
.hint{
  flex:none; padding:9px 26px 12px; font-size:12px; color:var(--faint);
  text-align:center; border-top:1px solid var(--edge);
}
kbd{font:inherit; font-size:11.5px; color:var(--dim);
    border:1px solid var(--edge); border-radius:3px; padding:1px 5px}

@media(max-width:900px){
  body{font-size:13.5px}
  .rig{padding:10px 14px 11px}
  #screen{padding:16px 14px 6px} #sl{padding:10px 14px} .hint{padding:8px 14px 10px}
}
</style>

<div class="rig">
  <div class="ctls">
    <div class="ctl">
      <span class="k">Machine</span>
      <div class="seg" id="mseg">
        <button data-m="laptop" class="on">laptop &middot; Pro subscription</button>
        <button data-m="ci">build box &middot; no subscription</button>
      </div>
    </div>
    <div class="ctl">
      <span class="k">Precedence</span>
      <div class="seg" id="pseg">
        <button data-p="today" class="on">ships today</button>
        <button data-p="proposed" class="alt">proposed</button>
      </div>
    </div>
  </div>
  <p class="why">
    Same commands on both settings. The precedence order is the only thing that
    changes, and it decides which credential pays.
  </p>
</div>

<div id="screen"><div id="inner"><div id="out"></div><div class="line" id="prompt"><span class="ps" id="ps">$</span><span><span id="typed"></span><span id="ghost"></span><span class="cur"></span></span></div><input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input"></div></div>

<div id="sl" hidden><div class="in" id="slin"></div></div>

<div class="hint">
  <kbd>Tab</kbd> complete &nbsp; <kbd>&#8593;</kbd><kbd>&#8595;</kbd> history &nbsp;
  <kbd>Enter</kbd> run &nbsp; <kbd>&#8997;B</kbd> bill the subscription instead
</div>

<script>
var out=document.getElementById('out'), screenEl=document.getElementById('screen'),
    typedEl=document.getElementById('typed'), ghostEl=document.getElementById('ghost'),
    promptEl=document.getElementById('prompt'), psEl=document.getElementById('ps'),
    slEl=document.getElementById('sl'), slIn=document.getElementById('slin'),
    kb=document.getElementById('kb');

var buf='', hist=[], hp=-1, mode='shell', menu=null;

/* ---- the fixture ------------------------------------------------------- */
/* prototype/mock-session.json, field for field. `windowMins` is the 5-hour
   window re-clocked to replay time, the way the README runs it: the capture's
   own reset time has passed. */
var FIX={model:'Opus', dir:'~/projects/reports', branch:'main*',
         ctxPct:41, costUsd:2.1437, fivePct:62.0, elapsedMs:2280000, windowMins:35};
var KEY='sk-ant-test0000000000000000000000004f2a';

/* ---- machine and precedence -------------------------------------------- */
var machine='laptop', precedence='today';
var env={ANTHROPIC_API_KEY:'', ANTHROPIC_AUTH_TOKEN:'', CLAUDE_CODE_API_KEY:''};
/* What Claude Code stores as customApiKeyResponses: an answer per truncated
   key, per machine, remembered for every later session. */
var answers={laptop:{}, ci:{}};
var session=null;

function tail(v){ return v.slice(-4) }
function sub(){ return machine==='laptop' ? 'pro' : null }

/* The precedence order, shortened to the credentials this mock tracks. */
function chain(){
  if(session && session.rebill) return [{sub:1}];
  return precedence==='today'
    ? [{v:'ANTHROPIC_AUTH_TOKEN'},{v:'ANTHROPIC_API_KEY',asked:1},{sub:1}]
    : [{v:'ANTHROPIC_AUTH_TOKEN'},{v:'CLAUDE_CODE_API_KEY'},{sub:1},{v:'ANTHROPIC_API_KEY'}];
}

/* Who pays, and what the status line calls it. Mirrors the three states in
   prototype/statusline-billing.sh: SUB, CONFLICT, API. */
function resolve(){
  var c=chain(), payer=null;
  for(var i=0;i<c.length;i++){
    if(c[i].sub){ if(sub()){ payer={kind:'sub', plan:sub()}; break } continue }
    var val=env[c[i].v];
    if(!val) continue;
    if(c[i].asked && answers[machine][tail(val)]==='no') continue;
    payer={kind:'key', v:c[i].v, tail:tail(val)}; break;
  }
  if(!payer) return {state:'UNKNOWN'};
  if(payer.kind==='sub') return {state:'SUB', plan:payer.plan};
  return {state: sub() ? 'CONFLICT' : 'API', v:payer.v, tail:payer.tail, latent:sub()};
}

/* ---- the status line, rendered the way the script prints it ------------- */
function bar(){
  var f=Math.floor(FIX.ctxPct/10), s='';
  for(var i=0;i<10;i++) s += i<f ? '█' : '░';
  var col = FIX.ctxPct>=85 ? 'stop' : FIX.ctxPct>=60 ? 'warn' : 'ok';
  return '<span class="'+col+'">'+s+'</span> '+FIX.ctxPct+'%';
}
function money(){ return '$'+FIX.costUsd.toFixed(2) }
/* Burn per minute against the 5-hour window, extrapolated to the reset. */
function projection(){
  var mins=FIX.elapsedMs/60000, rate=FIX.fivePct/mins,
      projected=Math.round(FIX.fivePct + rate*FIX.windowMins);
  if(projected<85)  return '<span class="ok">finishes</span>';
  if(projected<100) return '<span class="warn">tight ('+projected+'%)</span>';
  return '<span class="stop">caps in ~'+Math.round((100-FIX.fivePct)/rate)+'min</span>';
}
function statusLine(){
  var r=resolve(), badge, note='', second;
  if(r.state==='SUB'){
    badge='<span class="ok">◆ <span class="b">'+r.plan.toUpperCase()+' SUB</span></span>';
    second=bar()+'<span class="dim"> · 5h '+Math.round(FIX.fivePct)+'% · </span>'+projection();
  } else if(r.state==='CONFLICT'){
    badge='<span class="warn">▲ <span class="b">API KEY ····'+r.tail+'</span></span>';
    second=bar()+'<span class="dim"> · '+money()+'</span>';
    note='\n<span class="warn">'+r.v+' displaced your '+r.latent+' subscription</span>'
        +'\n<span class="dim">  ↳ press ⌥B to bill the subscription instead</span>';
  } else if(r.state==='API'){
    badge='<span class="blue">◇ API KEY ····'+r.tail+'</span>';
    second=bar()+'<span class="dim"> · '+money()+'</span>';
  } else {
    badge='<span class="dim">? auth unknown</span>';
    second=bar();
  }
  return '<span class="tag">added by this proposal</span>'
       + badge+' <span class="dim">·</span> '+FIX.model
       + ' <span class="dim">·</span> '+FIX.branch+'\n'+second+note;
}
function paintStatus(){
  slEl.hidden = !session;
  if(session) slIn.innerHTML=statusLine();
  requestAnimationFrame(function(){ screenEl.scrollTop=screenEl.scrollHeight });
}

/* ---- output ------------------------------------------------------------ */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function w(html){ out.innerHTML+=html+'\n'; screenEl.scrollTop=screenEl.scrollHeight }
/* A mock note: something this page adds, not something the CLI prints. */
function mn(html){
  out.innerHTML+='<span class="mn">'+html+'</span>';
  screenEl.scrollTop=screenEl.scrollHeight;
}

/* ---- commands ---------------------------------------------------------- */
var CMDS=['claude','claude -p "reconcile last night"',
          "claude auth status --json | jq -c '{authMethod,apiProvider,subscriptionType}'",
          'export ANTHROPIC_API_KEY='+KEY,
          'export CLAUDE_CODE_API_KEY="$ANTHROPIC_API_KEY"',
          'unset ANTHROPIC_API_KEY','unset CLAUDE_CODE_API_KEY',
          'env','help','clear'];
var SESSION_CMDS=['/cost','exit'];

function complete(p){
  if(!p) return '';
  var pool = mode==='session' ? SESSION_CMDS.concat(['exit']) : CMDS;
  for(var i=0;i<pool.length;i++) if(pool[i].indexOf(p)===0) return pool[i].slice(p.length);
  return '';
}
function draw(){
  typedEl.textContent=buf;
  ghostEl.textContent = (mode==='shell'||mode==='session') ? complete(buf) : '';
}

function cmdHelp(){
  w('');
  w('  <span class="dim">export ANTHROPIC_API_KEY=…</span>      the key most machines already carry');
  w('  <span class="dim">export CLAUDE_CODE_API_KEY=…</span>    the variable the proposal adds');
  w('  <span class="dim">unset …</span>                          drop either one');
  w('  <span class="dim">claude auth status --json</span>        what the CLI reports about billing');
  w('  <span class="dim">claude</span>                           start a session');
  w('  <span class="dim">claude -p "…"</span>                    one unattended turn');
  w('  <span class="dim">env</span>                              the credentials this mock tracks');
  w('  <span class="dim">clear</span>                            clear the screen');
  w('');
  w('  <span class="faint">In a session: </span><span class="dim">/cost</span>'
   +'<span class="faint">, </span><span class="dim">exit</span>'
   +'<span class="faint">, and ⌥B to bill the subscription instead.</span>');
  w('');
}

function cmdEnv(){
  var any=false;
  w('');
  ['ANTHROPIC_AUTH_TOKEN','ANTHROPIC_API_KEY','CLAUDE_CODE_API_KEY'].forEach(function(k){
    if(!env[k]) return;
    any=true;
    w('  '+k+'=<span class="dim">sk-ant-...'+tail(env[k])+'</span>');
  });
  if(!any) w('  <span class="dim">no credential variables set</span>');
  w('');
  if(env.CLAUDE_CODE_API_KEY && precedence==='today')
    mn('CLAUDE_CODE_API_KEY does not exist today. Claude Code never reads it, so\n'
      +'setting it changes nothing until the precedence order changes.');
  w('');
}

/* Reproduced on v2.1.260, 3 September 2026, and on v2.1.252 before it: setting
   ANTHROPIC_API_KEY displaces the subscription while authMethod and apiProvider
   keep reporting the same values. Only subscriptionType moves. */
function cmdAuth(){
  var r=resolve(), plan;
  w('');
  if(!sub()){
    mn('Not reproduced on a machine with no subscription signed in, so this mock\n'
      +'does not print an answer for it. The two states it does print were both\n'
      +'reproduced on a machine that has one.');
    w('');
    return;
  }
  plan = (r.state==='CONFLICT') ? 'null' : '"pro"';
  w('  {"authMethod":"claude.ai","apiProvider":"firstParty","subscriptionType":'
    +(plan==='null' ? '<span class="warn"><span class="b">null</span></span>' : '<span class="ok">"pro"</span>')+'}');
  w('');
  if(r.state==='CONFLICT')
    w('  <span class="dim">The subscription is still signed in. It is just not paying, and the two</span>\n'
     +'  <span class="dim">fields you would check to find that out have not moved.</span>');
  else
    w('  <span class="dim">Narrowed to three fields. The full object also carries account identifiers.</span>');
  w('');
}

/* ---- starting a session ------------------------------------------------ */
function cmdClaude(){
  var v=env.ANTHROPIC_API_KEY;
  if(precedence==='today' && v && answers[machine][tail(v)]===undefined) return keyDialog(tail(v));
  openSession();
}

/* The dialog the CLI draws when it finds a custom API key. Wording, order and
   the default focus on "No (recommended)" are the shipped ones. */
function keyDialog(t){
  mode='menu';
  menu={i:1, anchor:out.innerHTML, t:t, cb:function(i){
    answers[machine][t] = i===0 ? 'yes' : 'no';
    if(i===0) mn('Remembered for sk-ant-...'+t+'. Later sessions do not ask again,\n'
                +'on this machine, for this key.');
    else      mn('Recorded as rejected. Your subscription pays instead.');
    w('');
    openSession();
  }};
  paintMenu();
}
function paintMenu(){
  out.innerHTML=menu.anchor;
  w('<div class="dlg">'
   +'<span class="ttl">Detected a custom API key in your environment</span>\n\n'
   +'<span class="b">ANTHROPIC_API_KEY</span>: sk-ant-...'+menu.t+'\n'
   +'Do you want to use this API key?\n\n'
   +'<span class="opt'+(menu.i===0?' sel':'')+'"><span class="mk">❯</span> Yes</span>\n'
   +'<span class="opt'+(menu.i===1?' sel':'')+'"><span class="mk">❯</span> No (<span class="b">recommended</span>)</span>'
   +'</div>');
  promptEl.classList.add('hide');
}
function chooseMenu(){
  var m=menu; menu=null; mode='run';
  out.innerHTML=m.anchor;
  w('<div class="dlg"><span class="ttl">Detected a custom API key in your environment</span>\n\n'
   +'<span class="b">ANTHROPIC_API_KEY</span>: sk-ant-...'+m.t+'\n'
   +'Do you want to use this API key?  <span class="new">'
   +(m.i===0?'Yes':'No (recommended)')+'</span></div>');
  promptEl.classList.remove('hide');
  m.cb(m.i);
}

function openSession(){
  session={rebill:false};
  var r=resolve();
  w('');
  w('  <span class="dim">Claude Code 2.1.260 · '+FIX.model+' · '+FIX.dir+'</span>');
  w('');
  if(r.state==='CONFLICT'){
    mn('Nothing in the session tells you a subscription was displaced. The status\n'
      +'line below is what this proposal adds.');
  } else if(precedence==='proposed' && env.ANTHROPIC_API_KEY && r.state==='SUB'){
    mn('ANTHROPIC_API_KEY is set and is not paying: it now sits below your\n'
      +'subscription. To bill it deliberately:\n'
      +'  export CLAUDE_CODE_API_KEY="$ANTHROPIC_API_KEY"');
  }
  w('');
  mode='session'; psEl.textContent='>';
  paintStatus();
}

function cmdCost(){
  w('');
  w('  <span class="dim">Total cost:            </span>'+money());
  w('  <span class="dim">Total duration (wall): </span>'+Math.round(FIX.elapsedMs/60000)+'m 0s');
  w('');
  mn('Those are the two lines this fixture carries figures for. /cost prints\n'
    +'more, and none of them name the credential that is paying. You have to\n'
    +'suspect something before you run it.');
  w('');
}

function rebill(){
  if(!session) return;
  if(resolve().state!=='CONFLICT') return;
  session.rebill=true;
  w('');
  w('  <span class="ok">Billing switched to your pro subscription for this session.</span>');
  mn('The addition. Nothing today moves billing without restarting the session\n'
    +'with a different environment.');
  w('  <span class="dim">To make it permanent: unset ANTHROPIC_API_KEY</span>');
  w('');
  paintStatus();
}

/* ---- one unattended turn ----------------------------------------------- */
function cmdPrint(arg){
  var r=resolve();
  w('');
  w('  <span class="dim">412 rows reconciled, 3 unmatched.</span>');
  w('');
  if(r.state==='CONFLICT'){
    mn('Billed to '+r.v+' (sk-ant-...'+r.tail+'), which displaced your '+r.latent+'\n'
      +'subscription. No prompt appears in -p, whatever you answered before, and\n'
      +'no status line renders. This is the session type the reported charges\n'
      +'accrue in.');
  } else if(r.state==='API'){
    mn('Billed to '+r.v+' (sk-ant-...'+r.tail+'). No subscription exists on this\n'
      +'machine, so this is the correct account and there is nothing to warn about.');
  } else if(r.state==='SUB'){
    mn('Billed to your '+r.plan+' subscription'
      +(env.ANTHROPIC_API_KEY ? ', with ANTHROPIC_API_KEY set and unused.' : '.'));
  } else {
    mn('No credential resolved.');
  }
  w('');
}

/* ---- input ------------------------------------------------------------- */
function setBuf(v){ buf=v; kb.value=v; draw() }

function run(line){
  var c=line.trim(), m;
  w('<span class="ok">'+psEl.textContent+'</span> '+esc(c));
  if(!c) return;
  hist.push(c); hp=hist.length;

  if(c==='clear'){ out.innerHTML=''; boot(true); return }
  if(c==='help'){ return cmdHelp() }

  if(mode==='session'){
    if(c==='exit'){
      session=null; paintStatus(); mode='shell'; psEl.textContent='$';
      w(''); w('  <span class="dim">Session ended.</span>'); w('');
      return;
    }
    if(c==='/cost') return cmdCost();
    w('  <span class="faint">Nothing runs here. This mock only tracks which credential would pay.</span>');
    w('  <span class="faint">Try /cost, ⌥B, or exit.</span>');
    w('');
    return;
  }

  if((m=c.match(/^export\s+([A-Z_]+)=(.*)$/))){
    var k=m[1], v=m[2].replace(/^["']|["']$/g,'');
    if(!(k in env)){
      w('  <span class="stop">'+esc(k)+' is not a credential this mock tracks.</span>');
      w('  <span class="dim">ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_API_KEY.</span>');
      w(''); return;
    }
    if(v==='$ANTHROPIC_API_KEY') v=env.ANTHROPIC_API_KEY;
    if(!v) v=KEY;
    env[k]=v;
    w('');
    w('  <span class="dim">'+k+'=sk-ant-...'+tail(v)+'</span>');
    if(k==='CLAUDE_CODE_API_KEY' && precedence==='today')
      mn('Claude Code does not read this variable today. Switch Precedence to\n'
        +'proposed to make it the credential that pays.');
    w('');
    paintStatus();
    return;
  }
  if((m=c.match(/^unset\s+([A-Z_]+)$/))){
    if(!(m[1] in env)){ w('  <span class="stop">'+esc(m[1])+' is not a credential this mock tracks.</span>'); w(''); return }
    env[m[1]]='';
    w(''); w('  <span class="dim">'+m[1]+' unset</span>'); w('');
    paintStatus();
    return;
  }
  if(c==='env') return cmdEnv();
  if(/^claude auth status/.test(c)) return cmdAuth();
  if(/^claude\s+-p\b/.test(c)) return cmdPrint(c);
  if(c==='claude') return cmdClaude();

  w('  <span class="stop">'+esc(c.split(' ')[0])+': not a command here.</span> <span class="dim">Try help.</span>');
  w('');
}

function focusKb(){ try{ kb.focus({preventScroll:true}) }catch(err){ kb.focus() } }

kb.addEventListener('input',function(){
  if(mode==='menu'||mode==='run'){ kb.value=''; return }
  buf=kb.value; draw();
});

kb.addEventListener('keydown',function(e){
  /* The rebill key. Option+B on a Mac inserts a character, so it is caught by
     position rather than by the value it produces. */
  if(e.altKey && e.code==='KeyB'){ e.preventDefault(); rebill(); return }
  if(e.metaKey||e.ctrlKey||e.altKey) return;

  if(mode==='menu'){
    e.preventDefault();
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ menu.i=1-menu.i; paintMenu() }
    else if(e.key==='Enter'){ chooseMenu() }
    else if(e.key==='Escape'){ menu.i=1; chooseMenu() }
    return;
  }
  if(mode==='run'){ e.preventDefault(); return }

  if(e.key==='Enter'){ e.preventDefault(); var l=buf; setBuf(''); run(l) }
  else if(e.key==='Tab'){ e.preventDefault(); setBuf(buf+complete(buf)) }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(hp>0){ hp--; setBuf(hist[hp]) } }
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(hp<hist.length-1){ hp++; setBuf(hist[hp]) } else { hp=hist.length; setBuf('') }
  }
});

screenEl.addEventListener('mousedown',function(e){
  if(window.getSelection().toString()) return;
  e.preventDefault(); focusKb();
});
kb.addEventListener('blur',function(){ setTimeout(focusKb,0) });

/* ---- the two controls -------------------------------------------------- */
/* Changing a control ends a running session and keeps the environment, so the
   next `claude` shows the new setting's effect. An open key dialog is dismissed
   with no answer recorded. */
function endSession(reason){
  if(mode==='menu'){
    out.innerHTML=menu.anchor; menu=null; promptEl.classList.remove('hide');
    mode='shell'; psEl.textContent='$'; setBuf('');
    w('  <span class="dim">Dialog dismissed, '+reason+' changed. No answer recorded.</span>');
    return;
  }
  if(!session) return;
  session=null; mode='shell'; psEl.textContent='$'; setBuf('');
  w('  <span class="dim">Session ended, '+reason+' changed.</span>');
  paintStatus();
}
document.getElementById('mseg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(machine===b.dataset.m) return;
  endSession('machine');
  machine=b.dataset.m;
  [].forEach.call(this.children,function(c){ c.classList.toggle('on', c===b) });
  w('  <span class="new">─</span> <span class="dim">machine: '+b.textContent.trim()+'</span>');
  w('');
  paintStatus(); focusKb();
});
document.getElementById('pseg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(precedence===b.dataset.p) return;
  endSession('precedence');
  precedence=b.dataset.p;
  [].forEach.call(this.children,function(c){ c.classList.toggle('on', c===b) });
  w('  <span class="new">─</span> <span class="dim">precedence: '+b.textContent.trim()
   +(precedence==='proposed'
      ? ' · ANTHROPIC_API_KEY drops below the subscription, CLAUDE_CODE_API_KEY takes its level'
      : ' · ANTHROPIC_API_KEY outranks the subscription, CLAUDE_CODE_API_KEY is not read')+'</span>');
  w('');
  paintStatus(); focusKb();
});

/* ---- boot -------------------------------------------------------------- */
function boot(quiet){
  if(!quiet){
    w('<span class="dim">zsh · '+FIX.dir+'</span>');
    w('');
    w('<span class="faint">A drivable mock of which credential pays for a Claude Code session.</span>');
    w('<span class="faint">Start with </span><span class="dim">export ANTHROPIC_API_KEY=…</span>'
     +'<span class="faint">, then </span><span class="dim">claude</span>'
     +'<span class="faint">. Or </span><span class="dim">help</span><span class="faint">.</span>');
    w('');
    mn('The custom API key dialog, the auth status fields and the /cost layout are\n'
      +'replicated from Claude Code 2.1.260. Everything marked with this rule is\n'
      +'added by the proposal and does not ship. Figures come from the prototype;\n'
      +'the key is synthetic.');
  }
  w('');
  mode='shell'; psEl.textContent='$'; setBuf(''); focusKb();
}
boot(false);
