<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer platform entry point</title>

<style>
/* claude.ai, replicated from the live product on 3 September 2026: rail order,
   account row, composer controls and header control are as observed. The one
   addition is the Developer platform row, which carries the New pill the product
   already uses for new navigation. It navigates in place, as the rows above it do;
   the two existing entry points open a new tab, which is what makes them read as
   exits rather than as part of the product.
   Account name, chats and projects are synthetic. */
:root{
  --rail:#1B1B19; --main:#232321; --panel:#2A2926; --raise:#302F2B;
  --edge:#37362F; --edge-soft:#2C2B27;
  --txt:#EFEDE7; --dim:#9C978D; --faint:#6E6A62;
  --accent:#D97757; --accent-soft:#3A2A22;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--main); color:var(--txt);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}

.app{display:grid;grid-template-columns:235px minmax(0,1fr);height:100%}

/* ---------------- rail ---------------- */
.rail{
  background:var(--rail); display:flex; flex-direction:column;
  padding:12px 10px 10px; min-height:0;
}
.rhead{display:flex;align-items:center;gap:8px;padding:2px 6px 14px}
.mark{font-family:var(--serif);font-size:20px;letter-spacing:-.01em;color:var(--txt)}
.rhead .sp{margin-left:auto;display:flex;gap:2px}
.ic{padding:5px;border-radius:6px;color:var(--dim)}
.ic:hover{background:var(--raise);color:var(--txt)}

.nav{display:flex;flex-direction:column;gap:1px}
.ni{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 8px;border-radius:7px;color:var(--dim);font-size:13.5px;
}
.ni:hover{background:var(--raise);color:var(--txt)}
.ni.on{background:var(--raise);color:var(--txt)}
.ni .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 5px;
}

.grp{display:flex;align-items:center;gap:8px;padding:16px 8px 5px;color:var(--faint);font-size:11.5px}
.grp .lbl{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:#3A3933;border-radius:3px}
.ci{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px 8px;border-radius:7px;color:var(--dim);font-size:13px;
}
.ci:hover{background:var(--raise);color:var(--txt)}
.ci .d{width:5px;height:5px;border-radius:50%;background:#4A4840;flex:none}
.ci .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.acct{border-top:1px solid var(--edge-soft);margin-top:8px;padding-top:8px;display:flex;align-items:center;gap:6px}
.acct .who{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;flex:1;min-width:0}
.acct .who:hover{background:var(--raise)}
.av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.acct .nm{font-size:13px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .cv{color:var(--faint);font-size:9px}

/* ---------------- main ---------------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0}
.mhead{display:flex;justify-content:flex-end;padding:14px 18px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 24px 9vh;min-height:0}
.hi{font-family:var(--serif);font-size:34px;letter-spacing:-.01em;display:flex;align-items:center;gap:14px;margin-bottom:26px;color:var(--txt)}
.star{color:var(--accent);font-size:27px}

.comp{width:100%;max-width:722px;background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:15px 15px 11px;box-shadow:0 2px 14px rgba(0,0,0,.16)}
.comp textarea{
  width:100%;background:none;border:none;resize:none;color:var(--txt);
  font:inherit;font-size:15px;line-height:1.5;outline:none;min-height:38px;max-height:180px;
}
.comp textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;gap:7px;margin-top:9px}
.rnd{width:27px;height:27px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;color:var(--dim)}
.rnd:hover{background:var(--raise);color:var(--txt)}
.tabs{display:flex;background:var(--rail);border-radius:8px;padding:2px;gap:1px}
.tabs button{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--dim)}
.tabs button.on{background:var(--raise);color:var(--txt);font-weight:550}
.crow .r{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--dim);font-size:12.5px}
.crow .r .eff{color:var(--faint)}

.note{
  position:absolute;right:15px;bottom:11px;margin:0;font-size:10px;color:#57544D;
  letter-spacing:.01em;max-width:430px;text-align:right;line-height:1.45;
}
.note b{color:#6E6A62;font-weight:600}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .hi{font-size:26px}
  .note{position:static;text-align:center;max-width:none;padding:0 20px 14px}
}
</style>

<div class="app">
  <nav class="rail">
    <div class="rhead">
      <span class="mark">Claude</span>
      <span class="sp">
        <button class="ic" aria-label="Chats"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4.5A2.5 2.5 0 0 1 4.5 2h7A2.5 2.5 0 0 1 14 4.5v4A2.5 2.5 0 0 1 11.5 11H6l-3.2 2.6a.3.3 0 0 1-.5-.24V11A.9.9 0 0 1 2 10.2z"/></svg></button>
        <button class="ic" aria-label="Code"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 4 2.5 8 6 12M10 4l3.5 4L10 12"/></svg></button>
      </span>
    </div>

    <div class="nav">
      <button class="ni on">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
        <span class="lbl">New</span>
      </button>
      <button class="ni">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.4 5.2A1.6 1.6 0 0 1 4 3.6h2.4l1.3 1.6H12a1.6 1.6 0 0 1 1.6 1.6v4.4A1.6 1.6 0 0 1 12 12.8H4a1.6 1.6 0 0 1-1.6-1.6z"/></svg>
        <span class="lbl">Projects</span>
      </button>
      <button class="ni">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 2.4 9.5 6.5 13.6 8 9.5 9.5 8 13.6 6.5 9.5 2.4 8 6.5 6.5z"/></svg>
        <span class="lbl">Artifacts</span>
      </button>
      <button class="ni">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.1 1.5"/></svg>
        <span class="lbl">Scheduled</span>
      </button>
      <button class="ni">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.6 5.2h10.8M2.6 10.8h10.8"/><circle cx="6" cy="5.2" r="1.5" fill="var(--rail)"/><circle cx="10.4" cy="10.8" r="1.5" fill="var(--rail)"/></svg>
        <span class="lbl">Customize</span>
      </button>

      <!-- the one addition -->
      <a class="ni" id="platformRow"
         href="https://platform.claude.com/dashboard?utm_source=claude_ai&amp;utm_medium=rail&amp;utm_campaign=platform_entry&amp;utm_content=rail_row">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8.7 1.9 3.4 9.1h3.5l-.6 5 5.3-7.2H8.1z"/></svg>
        <span class="lbl">Developer platform</span>
        <span class="pill">New</span>
      </a>
    </div>

    <div class="grp"><span class="lbl">Projects</span>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg>
    </div>
    <button class="ci"><span class="t">Ledger reconciliation</span></button>

    <div class="grp"><span class="lbl">Chats and tasks</span>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5h10M5 8h6M6.5 11h3"/></svg>
    </div>
    <div class="scroll">
      <button class="ci"><span class="d"></span><span class="t">Nightly reconcile task</span></button>
      <button class="ci"><span class="d"></span><span class="t">Retry backoff on 429s</span></button>
      <button class="ci"><span class="d"></span><span class="t">Batch job cost estimate</span></button>
      <button class="ci"><span class="d"></span><span class="t">Sourdough starter schedule</span></button>
      <button class="ci"><span class="d"></span><span class="t">Parquet vs CSV for the export</span></button>
      <button class="ci"><span class="d"></span><span class="t">Weekend trip packing list</span></button>
      <button class="ci"><span class="d"></span><span class="t">Refactor the webhook handler</span></button>
      <button class="ci"><span class="d"></span><span class="t">Reading list for Q4</span></button>
      <button class="ci"><span class="d"></span><span class="t">Grafana panel for p95 latency</span></button>
      <button class="ci"><span class="d"></span><span class="t">Explain consistent hashing</span></button>
    </div>

    <div class="acct">
      <button class="who">
        <span class="av">A</span>
        <span class="nm">alex · Max</span>
        <span class="cv">⌄</span>
      </button>
      <button class="ic" aria-label="Downloads"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 2.8v7.4M5 7.4 8 10.4l3-3M3 12.8h10"/></svg></button>
      <button class="ic" aria-label="Search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7.2" cy="7.2" r="4.2"/><path d="m10.4 10.4 2.6 2.6"/></svg></button>
    </div>
  </nav>

  <main class="main">
    <div class="mhead">
      <button class="ic" aria-label="Use incognito"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 8.6h10M5.4 4.2h5.2l1.4 4.4H4z"/><circle cx="5.2" cy="11" r="1.9"/><circle cx="10.8" cy="11" r="1.9"/></svg></button>
    </div>

    <div class="stage">
      <div class="hi"><span class="star">✳</span>alex returns!</div>

      <div class="comp">
        <textarea id="ta" rows="1" placeholder="How can I help you today?"></textarea>
        <div class="crow">
          <button class="rnd" aria-label="Attach"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg></button>
          <div class="tabs">
            <button class="on">Chat</button>
            <button>Cowork</button>
          </div>
          <div class="r">
            <span>Opus 5</span><span class="eff">High</span>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 2.6a1.9 1.9 0 0 1 1.9 1.9v3.2a1.9 1.9 0 0 1-3.8 0V4.5A1.9 1.9 0 0 1 8 2.6z"/><path d="M4.4 7.6a3.6 3.6 0 0 0 7.2 0M8 11.2v2.2"/></svg>
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.4 6.4 3.6 3.6 3.6-3.6"/></svg>
          </div>
        </div>
      </div>
    </div>

    <p class="note">
      <b>One addition:</b> the Developer platform row, linking to the platform dashboard.
      Everything else replicates claude.ai, 3 September 2026. Account and chats are synthetic.
    </p>
  </main>
</div>

<script>
(function () {
  var ta = document.getElementById('ta');
  function grow() { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  ta.addEventListener('input', grow);
  ta.focus({ preventScroll: true });

  // Tab group behaves like the real composer.
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (o) { o.classList.remove('on'); });
      b.classList.add('on');
    });
  });
})();
</script>
