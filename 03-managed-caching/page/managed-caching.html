<title>Managed Prompt Caching</title>

<style>
/* Console-native surface, matching 02-openai-migration/app/src/styles.css.
   Warm neutrals; coral reserved for product chrome. Semantic colour is a
   separate scale so it never competes: warn = the surcharge, ok = a cache
   that reads. crit is deliberately unused &mdash; a surcharge is not an outage,
   and spending red here would overstate it.
   Single-theme by intent: this is a replica of a light Console. */

:root {
  --bg:        #FAFAF8;
  --panel:     #FFFFFF;
  --sunk:      #F4F3EF;
  --ink:       #191817;
  --ink-2:     #5E5C55;
  --ink-3:     #8E8B82;
  --rule:      #E6E4DC;
  --rule-soft: #F0EEE8;
  --accent:    #D97757;
  --accent-dim:#FBF0EA;
  --accent-ink:#A84E2C;
  --ok:        #2E7D5B;
  --ok-dim:    #EAF4EF;
  --warn:      #A87613;
  --warn-dim:  #FAF2E1;
  --crit:      #B4432F;
  --crit-dim:  #FAEBE7;
  --shadow:    0 1px 2px rgba(25,24,23,.04);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ------------------------------------------------------------------ shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side {
  background: var(--bg); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; padding: 14px 10px 10px;
  position: sticky; top: 0; height: 100vh; overflow: hidden;
}
.ws {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule); border-radius: 7px;
  background: var(--panel); padding: 7px 10px; margin-bottom: 12px;
  font-size: 13px; font-weight: 500;
}
.ws .dot { width: 13px; height: 13px; border-radius: 4px; background: var(--accent); flex: none; }
.ws-name { line-height: 1.15; }
.ws-name span { display: block; font-weight: 400; font-size: 11px; color: var(--ink-3); }
.ws .caret { margin-left: auto; color: var(--ink-3); font-size: 11px; }
.omni {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule); border-radius: 7px; background: var(--panel);
  padding: 6px 9px; margin-bottom: 14px; font-size: 12.5px; color: var(--ink-3);
}
.omni kbd {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px;
  background: var(--sunk); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 4px;
}
.nav { display: flex; flex-direction: column; gap: 1px; flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 6px; }
.nav::-webkit-scrollbar { width: 8px; }
.nav::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
.nav-group { margin-top: 13px; display: flex; flex-direction: column; gap: 1px; }
.nav-label { font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 4px 9px 3px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 6px;
  color: var(--ink-2); font-size: 13.5px; font-weight: 450;
  background: none; border: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--sunk); color: var(--ink); }
.nav-item.active { background: var(--sunk); color: var(--ink); font-weight: 550; }
.badge-beta {
  margin-left: auto; font-size: 9px; font-weight: 700; letter-spacing: .07em;
  color: var(--ink-2); background: var(--sunk); border: 1px solid var(--rule);
  padding: 1px 4px; border-radius: 4px;
}
.badge-dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
.side-foot { flex: none; padding-top: 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.side-foot .row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; font-size: 12.5px; color: var(--ink-2); }
.side-foot .row .val { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.avatar {

  color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none;
}
.who { font-size: 12.5px; font-weight: 550; line-height: 1.25; }
.who span { display: block; font-weight: 400; font-size: 11px; color: var(--ink-3); }

/* -------------------------------------------------------------- main area */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { border-bottom: 1px solid var(--rule); background: var(--bg); padding: 13px 28px 0; position: sticky; top: 0; z-index: 5; }
.crumbs { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.crumbs .muted { color: var(--ink-3); font-size: 13px; }
.crumbs .sep { color: var(--ink-3); }
.crumbs h1 { margin: 0; font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.tag {
  font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: var(--sunk); color: var(--ink-2); border: 1px solid var(--rule);
  padding: 3px 6px; border-radius: 4px;
}
.tag-prop { background: var(--accent-dim); color: var(--accent-ink); border-color: #F0D9CC; }
.crumbs .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.select { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; color: var(--ink-2); font-family: inherit; }
.tabs { display: flex; gap: 2px; margin-top: 13px; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 11px; font-size: 13.5px; color: var(--ink-2); font-weight: 450; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.content { padding: 22px 28px 64px; display: flex; flex-direction: column; gap: 22px; }

/* ------------------------------------------------------------------ atoms */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); }
.card-pad { padding: 16px 18px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.sec-head .count { color: var(--ink-3); font-size: 13px; }
.sec-head .right { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.sub { color: var(--ink-2); font-size: 13px; margin: 3px 0 0; max-width: 74ch; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 10px; }
.metric { padding: 14px 15px 12px; display: flex; flex-direction: column; gap: 2px; }
.metric .k { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.metric .v { font-size: 25px; font-weight: 550; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.metric .v.warn { color: var(--warn); }
.metric .s { font-size: 11.5px; color: var(--ink-3); }
.metric .viz { margin-top: 10px; }

.meter { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 3px; }
.cmp { display: flex; flex-direction: column; gap: 4px; }
.cmp-row { display: flex; align-items: center; gap: 7px; }
.cmp-label { font-size: 10px; color: var(--ink-3); width: 34px; flex: none; }
.cmp-track { flex: 1; height: 6px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.cmp-track span { display: block; height: 100%; border-radius: 3px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 550; border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
.chip-ok { background: var(--ok-dim); color: var(--ok); }
.chip-warn { background: var(--warn-dim); color: var(--warn); }
.chip-mute { background: var(--sunk); color: var(--ink-2); }
.chip-acc { background: var(--accent-dim); color: var(--accent-ink); }

.btn { white-space: nowrap; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 11px; font-size: 12.5px; font-weight: 500; }
.btn:hover { background: var(--sunk); }
.btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-primary:hover { background: #000; }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }

.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--warn-dim); border: 1px solid #EDDCB4; border-radius: 9px; padding: 13px 15px; font-size: 12.5px; line-height: 1.55; color: #6E4E0C; }
.banner b { color: #5A400A; }
.banner .acts { margin-left: auto; display: flex; gap: 6px; flex: none; align-items: center; }
.banner button.link { background: none; border: none; color: #8A6210; font-weight: 600; font-size: 12.5px; padding: 2px 4px; }
.banner button.link:hover { text-decoration: underline; }

.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 9px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover { background: #FCFCFA; }
tbody tr.on { background: var(--accent-dim); }
tbody tr.on:hover { background: var(--accent-dim); }
td.mono, .mono { font-family: var(--mono); font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.dim { color: var(--ink-3); }
.keyname { font-weight: 550; }
.keyname span { display: block; font-weight: 400; font-size: 11px; color: var(--ink-3); font-family: var(--mono); }

.cmdline { font-family: var(--mono); font-size: 12px; line-height: 1.7; background: var(--sunk); border: 1px solid var(--rule); border-radius: 7px; padding: 11px 13px; overflow-x: auto; color: var(--ink); }
.cmdline-row { white-space: pre; }
.cmdline .p, .cmdline .k { color: var(--ink-3); }
.cmdline .c { color: var(--accent-ink); }
.cmdline .add { color: var(--ok); }

.note { font-size: 12px; color: var(--ink-3); line-height: 1.55; }
.exits { display: grid; grid-template-columns: repeat(auto-fit, minmax(316px, 1fr)); gap: 10px; align-items: stretch; }
.exit { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; height: 100%; }
.exit h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.exit p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.exit .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 4px; }
.exit.paid { border-color: #EBCDBE; }

.diff { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; background: var(--sunk); border: 1px solid var(--rule); border-radius: 7px; padding: 10px 12px; overflow-x: auto; }
.diff .row { white-space: pre; }
.diff .minus { color: var(--crit); }
.diff .plus { color: var(--ok); }
.diff mark { background: #F6DFA8; color: inherit; border-radius: 2px; padding: 0 1px; }

.tl { display: flex; flex-direction: column; }
.tl-row { display: grid; grid-template-columns: 78px 128px 1fr; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.tl-row:last-child { border-bottom: none; }
.tl-t { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); padding-top: 2px; }
.tl-d { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }

.bp { display: flex; flex-direction: column; gap: 6px; }
.bp-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; }
.bp-lab { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.bp-track { position: relative; height: 26px; background: var(--sunk); border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; display: flex; }
.bp-seg { height: 100%; display: grid; place-items: center; font-size: 10px; color: var(--ink-3); border-right: 1px solid var(--rule); }
.bp-seg:last-child { border-right: none; }
.bp-mark { position: absolute; top: -1px; bottom: -1px; width: 3px; background: var(--accent); }
.bp-mark.ghost { background: var(--ink-3); opacity: .35; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.switch { width: 34px; height: 20px; border-radius: 10px; background: var(--rule); border: none; position: relative; padding: 0; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(14px); }

.foot-note { border-top: 1px solid var(--rule); padding-top: 14px; font-size: 12px; color: var(--ink-3); line-height: 1.6; max-width: 82ch; }
.foot-note b { color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .content { padding: 18px 16px 48px; }
  .topbar { padding: 13px 16px 0; }
}
</style>

<script>
/* ------------------------------------------------------------------ data
   Every number below is the output of ../prototype/cache_lint.py run against
   ../prototype/fixtures/. Nothing here is typed by hand, so the tabs and the
   linter cannot disagree. Verified pricing: 5m write 1.25x base input,
   1h write 2x, read 0.1x (0.025x on Fable 5.1 / Mythos 5.1). */

var PRICE = { "claude-sonnet-5": 2.00, "claude-opus-5": 5.00, "claude-haiku-4-5": 1.00 };
var DAYS = ["Aug 24", "Aug 25", "Aug 26", "Aug 27", "Aug 28"];

var KEYS = [
  { id: "apikey_01SilentMiss", name: "support-triage", env: "prod", model: "claude-sonnet-5",
    state: "surcharge", w5m: 1500000, w1h: 206020, read: 0, uncached: 4100,
    billed: 22.87, uncachedEquiv: 17.06, premium: 5.81, ifHit: 1.71, writeTotal: 8530100, readTotal: 0 },
  { id: "apikey_01Healthy", name: "billing-copilot", env: "prod", model: "claude-opus-5",
    state: "healthy", w5m: 180000, w1h: 0, read: 4200000, uncached: 9500,
    writeTotal: 900000, readTotal: 21000000 },
  { id: "apikey_01ShortPrefix", name: "docs-search", env: "staging", model: "claude-haiku-4-5",
    state: "below-floor", w5m: 800, w1h: 0, read: 0, uncached: 51000,
    writeTotal: 4000, readTotal: 0 },
  { id: "apikey_01NoBreakpoints", name: "sales-agent", env: "prod", model: "claude-sonnet-5",
    state: "never", w5m: 0, w1h: 0, read: 0, uncached: 3000000,
    writeTotal: 0, readTotal: 0 }
];

/* cache_lint.py explain fixtures/payload-log.json */
var TRANSITIONS = [
  { from: 0, to: 1, type: null },
  { from: 1, to: 2, type: "system_changed", detail: "first divergence at character 267",
    note: "The system prompt is not byte-stable between requests. It renders before every message, so this invalidates the entire conversation behind it. The first divergence is a timestamp.",
    before: 'date and time: 2026-08-26T14:0', mark: '3:11', after: 'date and time: 2026-08-26T14:0', markAfter: '8:52' },
  { from: 2, to: 3, type: "tools_changed", detail: "same tools, different serialization",
    note: "The tools array carries identical data in a different byte order. Something is iterating a map with undefined order, or re-serializing schemas on resend." },
  { from: 3, to: 4, type: "messages_changed", detail: "messages[1] altered",
    note: "An earlier turn was edited, truncated or reordered rather than appended to. Everything from that point on is a fresh write." },
  { from: 4, to: 5, type: "unavailable", detail: "prompt-affecting parameters changed: output_config",
    note: "The prefix is byte-identical, but a request parameter outside it changed. The API reports these as unavailable too." }
];

var STATE = {
  surcharge:     { chip: "chip-warn", label: "Paying surcharge" },
  healthy:       { chip: "chip-ok",   label: "Reading cache" },
  "below-floor": { chip: "chip-mute", label: "Below cacheable size" },
  never:         { chip: "chip-mute", label: "No breakpoints" }
};

var NAV = [
  { label: "Build", items: [ {l:"Playground"}, {l:"Files"}, {l:"Skills"}, {l:"Batches"} ] },
  { label: "Managed Agents", items: [ {l:"Quickstart"}, {l:"Agents"}, {l:"Sessions"}, {l:"Deployments"}, {l:"Environments"} ] },
  { label: "Analytics", items: [ {l:"Usage"}, {l:"Caching", ours:true, dot:true}, {l:"Rate limits"}, {l:"Cost"}, {l:"Logs"} ] },
  { label: "Manage", items: [ {l:"Rate limits"}, {l:"Spend limits"}, {l:"Service accounts"}, {l:"App Integrations", badge:"Beta"}, {l:"Notifications"} ] }
];

var TABS = [["overview","Overview"],["keys","API keys"],["diagnose","Diagnose"],["managed","Managed caching"]];

/* --------------------------------------------------------------- helpers */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function usd(n){ return "$" + n.toFixed(2); }
function tok(n){ return n >= 1e6 ? (n/1e6).toFixed(2).replace(/\.?0+$/,"") + "M" : n >= 1e3 ? Math.round(n/1e3) + "k" : String(n); }
function full(n){ return n.toLocaleString("en-US"); }
var el = function(h){ var d = document.createElement("div"); d.innerHTML = h; return d; };

var flagged = KEYS.filter(function(k){ return k.state === "surcharge"; });
var totalPremium = flagged.reduce(function(a,k){ return a + k.premium; }, 0);
var totalWrite = KEYS.reduce(function(a,k){ return a + k.writeTotal; }, 0);
var totalRead  = KEYS.reduce(function(a,k){ return a + k.readTotal; }, 0);
var hitRate = totalRead / (totalRead + totalWrite);

/* Five-day write/read chart, drawn to one scale per key so the shape of the
   defect reads at a glance: writes every day, a read line pinned to zero. */
function chart(k, w, h){
  var pad = { l: 46, r: 10, t: 10, b: 22 };
  w = w || 720; h = h || 176;
  var max = Math.max(k.w5m + k.w1h, k.read, 1);
  var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  var band = iw / DAYS.length, bw = Math.min(26, band / 3.2);
  var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:' + w + 'px;display:block" role="img" aria-label="Cache writes and reads per day">';
  [0, 0.5, 1].forEach(function(f){
    var y = pad.t + ih - f * ih;
    s += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (w - pad.r) + '" y2="' + y + '" stroke="#E6E4DC" stroke-width="1"/>';
    s += '<text x="' + (pad.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="9.5" fill="#8E8B82" font-family="ui-monospace, monospace">' + tok(Math.round(max * f)) + '</text>';
  });
  DAYS.forEach(function(d, i){
    var cx = pad.l + band * i + band / 2;
    var wv = (k.w5m + k.w1h) / max * ih, rv = k.read / max * ih;
    s += '<rect x="' + (cx - bw - 1.5) + '" y="' + (pad.t + ih - wv) + '" width="' + bw + '" height="' + Math.max(wv, 0) + '" rx="1.5" fill="#A87613"/>';
    if (k.read > 0) s += '<rect x="' + (cx + 1.5) + '" y="' + (pad.t + ih - rv) + '" width="' + bw + '" height="' + rv + '" rx="1.5" fill="#2E7D5B"/>';
    else s += '<line x1="' + (cx + 1.5) + '" y1="' + (pad.t + ih) + '" x2="' + (cx + 1.5 + bw) + '" y2="' + (pad.t + ih) + '" stroke="#2E7D5B" stroke-width="2"/>';
    s += '<text x="' + cx + '" y="' + (h - 6) + '" text-anchor="middle" font-size="9.5" fill="#8E8B82">' + d + '</text>';
  });
  return s + "</svg>";
}

function spark(k){
  var max = Math.max(k.w5m + k.w1h, k.read, 1), h = 20, bw = 4, gap = 3;
  var s = '<svg viewBox="0 0 ' + (DAYS.length * (bw * 2 + gap + 2)) + ' ' + h + '" width="72" height="20" role="img" aria-label="write and read per day">';
  DAYS.forEach(function(d, i){
    var x = i * (bw * 2 + gap + 2);
    var wv = Math.max((k.w5m + k.w1h) / max * h, k.w5m + k.w1h > 0 ? 2 : 0);
    var rv = Math.max(k.read / max * h, k.read > 0 ? 2 : 0);
    if (wv) s += '<rect x="' + x + '" y="' + (h - wv) + '" width="' + bw + '" height="' + wv + '" fill="#A87613"/>';
    if (rv) s += '<rect x="' + (x + bw + 1) + '" y="' + (h - rv) + '" width="' + bw + '" height="' + rv + '" fill="#2E7D5B"/>';
  });
  return s + "</svg>";
}

/* ----------------------------------------------------------------- routes */
function route(){
  var h = (location.hash || "#/caching/overview").replace(/^#\/?/, "").split("/").filter(Boolean);
  return { tab: h[1] || "overview", key: h[2] || "apikey_01SilentMiss" };
}
function go(tab, key){ location.hash = "#/caching/" + tab + (key ? "/" + key : ""); }
function keyById(id){ for (var i=0;i<KEYS.length;i++) if (KEYS[i].id === id) return KEYS[i]; return KEYS[0]; }

/* ------------------------------------------------------------------ views */
function vOverview(){
  var s = "";
  if (!window.__dismissed) {
    s += '<div class="banner"><div><b>' + flagged.length + ' API key is writing to cache and reading almost nothing back.</b> ' +
      'Cache writes bill 1.25&times; base input on the 5-minute TTL and 2&times; on the 1-hour TTL, against 0.1&times; for a read. ' +
      'Over the last 7 days this workspace paid <b>' + usd(totalPremium) + '</b> more than the same traffic would have cost with caching switched off.</div>' +
      '<div class="acts"><button class="btn btn-sm btn-primary" data-go="diagnose">Diagnose</button>' +
      '<button class="link" id="dismiss">Dismiss</button></div></div>';
  }

  s += '<div class="metrics">' +
    '<div class="card metric"><span class="k">Surcharge paid</span><span class="v warn">' + usd(totalPremium) + '</span>' +
      '<span class="s">above uncached, last 7 days</span><div class="viz"><div class="meter"><span style="width:' +
      (totalPremium / 17.06 * 100).toFixed(0) + '%;background:#A87613"></span></div></div></div>' +
    '<div class="card metric"><span class="k">Cache hit rate</span><span class="v">' + (hitRate * 100).toFixed(0) + '%</span>' +
      '<span class="s">' + tok(totalRead) + ' read / ' + tok(totalWrite) + ' written</span>' +
      '<div class="viz"><div class="cmp">' +
        '<div class="cmp-row"><span class="cmp-label">write</span><span class="cmp-track"><span style="width:100%;background:#A87613"></span></span></div>' +
        '<div class="cmp-row"><span class="cmp-label">read</span><span class="cmp-track"><span style="width:' + Math.min(totalRead/totalWrite*100,100).toFixed(0) + '%;background:#2E7D5B"></span></span></div>' +
      '</div></div></div>' +
    '<div class="card metric"><span class="k">Keys affected</span><span class="v">' + flagged.length + ' <span style="font-size:15px;color:#8E8B82">of ' + KEYS.length + '</span></span>' +
      '<span class="s">above the $5 materiality floor</span></div>' +
    '<div class="card metric"><span class="k">If those writes had read</span><span class="v">' + usd(flagged.reduce(function(a,k){return a+k.ifHit;},0)) + '</span>' +
      '<span class="s">vs ' + usd(flagged.reduce(function(a,k){return a+k.billed;},0)) + ' billed</span></div>' +
  '</div>';

  var k = flagged[0];
  s += '<div class="card"><div class="card-pad"><div class="sec-head"><h2>' + k.name + ' &middot; ' + k.env + '</h2>' +
    '<span class="chip chip-warn">Paying surcharge</span>' +
    '<span class="right">' + k.model + '</span></div>' +
    '<p class="sub">Five consecutive days of cache writes with no reads. The first write in any conversation has nothing to read, so a run this long means every conversation is a first.</p>' +
    '<div style="margin-top:14px">' + chart(k) + '</div>' +
    '<div class="legend" style="margin-top:6px;padding-left:46px">' +
      '<span><i style="background:#A87613"></i>Cache write</span>' +
      '<span><i style="background:#2E7D5B"></i>Cache read</span></div>' +
    '</div></div>';

  s += '<div class="grid2">' +
    '<div class="card card-pad"><div class="sec-head"><h2>What you were billed</h2></div>' +
      '<div class="tw" style="margin-top:8px"><table><tbody>' +
      '<tr><td>Billed for these writes</td><td class="num mono">' + usd(k.billed) + '</td></tr>' +
      '<tr><td>Same traffic, caching off</td><td class="num mono">' + usd(k.uncachedEquiv) + '</td></tr>' +
      '<tr><td><b>Surcharge</b></td><td class="num mono" style="color:#A87613"><b>' + usd(k.premium) + '</b></td></tr>' +
      '<tr><td class="dim">Had the cache read instead</td><td class="num mono dim">' + usd(k.ifHit) + '</td></tr>' +
      '</tbody></table></div>' +
      '<p class="note" style="margin-top:10px">The surcharge is arithmetic on billed tokens. The last row is a counterfactual: it assumes the prefix would have been reused, which this data cannot establish.</p></div>' +
    '<div class="card card-pad"><div class="sec-head"><h2>Why this is possible to detect today</h2></div>' +
      '<p class="sub" style="margin-top:6px">Nothing here is new telemetry. The usage report already returns the fields, grouped by API key, in buckets as fine as one minute.</p>' +
      '<div class="cmdline" style="margin-top:10px"><div class="cmdline-row"><span class="k">cache_creation.ephemeral_5m_input_tokens</span></div>' +
      '<div class="cmdline-row"><span class="k">cache_creation.ephemeral_1h_input_tokens</span></div>' +
      '<div class="cmdline-row"><span class="c">cache_read_input_tokens</span>  <span class="p">&larr; 0 for five days</span></div>' +
      '<div class="cmdline-row"><span class="k">uncached_input_tokens</span></div></div></div>' +
  '</div>';
  return s;
}

function vKeys(){
  var s = '<div class="card"><div class="card-pad"><div class="sec-head"><h2>API keys</h2>' +
    '<span class="count">' + KEYS.length + ' with traffic in the last 7 days</span>' +
    '<span class="right">Two of these are correctly not flagged</span></div>' +
    '<p class="sub">A workload with no stable prefix is right not to cache, and a prefix below the model&rsquo;s minimum cacheable length documentedly will not cache. Neither is a defect, and flagging either would train people to dismiss a billing warning.</p></div>' +
    '<div class="tw"><table><thead><tr><th>Key</th><th>Model</th><th>Write / read</th>' +
    '<th class="num">Written</th><th class="num">Read</th><th class="num">Surcharge</th><th>State</th></tr></thead><tbody>';
  KEYS.forEach(function(k){
    var st = STATE[k.state];
    s += '<tr class="pick" data-key="' + k.id + '">' +
      '<td><span class="keyname">' + k.name + ' &middot; ' + k.env + '<span>' + k.id + '</span></span></td>' +
      '<td class="mono dim">' + k.model + '</td>' +
      '<td>' + spark(k) + '</td>' +
      '<td class="num mono">' + full(k.writeTotal) + '</td>' +
      '<td class="num mono' + (k.readTotal ? '' : ' dim') + '">' + full(k.readTotal) + '</td>' +
      '<td class="num mono' + (k.premium ? '' : ' dim') + '"' + (k.premium ? ' style="color:#A87613;font-weight:600"' : '') + '>' + (k.premium ? usd(k.premium) : "&mdash;") + '</td>' +
      '<td><span class="chip ' + st.chip + '">' + st.label + '</span></td></tr>';
  });
  s += '</tbody></table></div></div>';
  s += '<p class="note">' + KEYS[2].name + ' writes ' + full(KEYS[2].writeTotal) + ' tokens with no reads, and is not flagged: at ' +
    full(800) + ' tokens per day it sits under the 4,096-token minimum cacheable prefix for ' + KEYS[2].model + '. ' +
    KEYS[3].name + ' sends ' + tok(15000000) + ' uncached input tokens and never sets a breakpoint, which is reported but never priced &mdash; this data cannot tell a missing breakpoint from a workload that correctly has none.</p>';
  return s;
}

function vDiagnose(r){
  var k = keyById(r.key);
  var s = '<div class="card card-pad"><div class="sec-head"><h2>' + k.name + ' &middot; ' + k.env + '</h2>' +
    '<span class="chip ' + STATE[k.state].chip + '">' + STATE[k.state].label + '</span>' +
    '<span class="right mono">' + k.id + '</span></div>' +
    '<div style="margin-top:12px">' + chart(k) + '</div>' +
    '<div class="legend" style="margin-top:6px;padding-left:46px">' +
      '<span><i style="background:#A87613"></i>Cache write</span><span><i style="background:#2E7D5B"></i>Cache read</span></div></div>';

  if (k.state !== "surcharge") {
    s += '<div class="card card-pad"><p class="sub">This key is not paying a surcharge. Pick <b>' + flagged[0].name + '</b> from ' +
      '<button class="btn btn-sm" data-go="keys">API keys</button> to see the diagnosis flow.</p></div>';
    return s;
  }

  s += '<div class="card card-pad"><div class="sec-head"><h2>Where the prefix broke</h2>' +
    '<span class="count">5 consecutive requests compared</span></div>' +
    '<p class="sub">The API can already answer this. Cache diagnostics compares consecutive requests and returns a typed reason. ' +
    'It is opt-in, and the beta header has to be on every request &mdash; retrofitting fails with <span class="mono">previous_message_not_found</span>, ' +
    'so today it only answers developers who already suspected the problem.</p><div class="tl" style="margin-top:8px">';
  TRANSITIONS.forEach(function(t){
    s += '<div class="tl-row"><span class="tl-t">[' + t.from + '] &rarr; [' + t.to + ']</span>' +
      '<span>' + (t.type ? '<span class="chip chip-warn mono">' + t.type + '</span>' : '<span class="chip chip-ok">prefix intact</span>') + '</span>' +
      '<span class="tl-d">' + (t.type ? '<b>' + esc(t.detail) + '</b><br>' + esc(t.note) : 'The breakpoint moved onto the newest turn. A moving marker is not an invalidator, and blocks marked on an earlier request still hit.') + '</span></div>';
  });
  s += '</div>';
  var t = TRANSITIONS[1];
  s += '<div class="diff" style="margin-top:12px">' +
    '<div class="row"><span class="minus">&minus;</span> ' + esc(t.before) + '<mark>' + esc(t.mark) + '</mark>Z</div>' +
    '<div class="row"><span class="plus">+</span> ' + esc(t.after) + '<mark>' + esc(t.markAfter) + '</mark>Z</div></div>';
  s += '<p class="note" style="margin-top:8px">Reported at the first divergence only. Later ones sit behind it and cannot be seen until it is fixed.</p></div>';

  s += '<div class="exits">' +
    '<div class="card exit"><div class="sec-head"><h3>Fix it yourself</h3><span class="chip chip-mute">Free</span></div>' +
      '<p>Turn on cache diagnostics and thread the previous response id through your requests. The response names which of model, system, tools or messages diverged.</p>' +
      '<div class="cmdline"><div class="cmdline-row"><span class="k">client.beta.messages.create(</span></div>' +
      '<div class="cmdline-row">  model=<span class="c">"' + k.model + '"</span>,</div>' +
      '<div class="cmdline-row">  <span class="add">betas=["cache-diagnosis-2026-04-07"]</span>,</div>' +
      '<div class="cmdline-row">  <span class="add">diagnostics={"previous_message_id": prev_id}</span>,</div>' +
      '<div class="cmdline-row"><span class="k">)</span></div></div>' +
      '<div class="foot"><button class="btn btn-sm" id="copy">Copy snippet</button><span class="note" id="copied"></span></div></div>' +
    '<div class="card exit paid"><div class="sec-head"><h3>Managed caching</h3><span class="chip chip-acc">Scale plan</span></div>' +
      '<p>Stop placing breakpoints. The platform measures which parts of your prompt are actually stable across your own traffic, ' +
      'places up to four breakpoints at those boundaries, and moves them when your traffic changes.</p>' +
      '<p class="note">Automatic caching already places one breakpoint of the four available slots, and never checks whether it worked.</p>' +
      '<div class="foot"><button class="btn btn-sm btn-primary" data-go="managed">See what it would do</button></div></div>' +
  '</div>';
  return s;
}

function vManaged(){
  var k = flagged[0];
  var on = !!window.__managed;
  var s = '<div class="card card-pad"><div class="sec-head"><h2>Managed caching</h2>' +
    '<span class="chip chip-acc">Proposed &middot; paid</span>' +
    '<span class="right"><span class="toggle"><button class="switch' + (on ? " on" : "") + '" id="mtoggle" role="switch" aria-checked="' + on + '" aria-label="Enable managed caching"></button>' +
    (on ? "Enabled for this workspace" : "Not enabled") + '</span></span></div>' +
    '<p class="sub">Automatic breakpoint placement ships today. It puts one breakpoint on the last cacheable block and moves it forward as the conversation grows. ' +
    'That is the right default for a plain multi-turn chat, and it is exactly wrong for a prompt with several stability boundaries &mdash; or one that ends in per-request content, ' +
    'where the breakpoint lands after the volatile tail and every request pays the write premium on bytes that are never read back.</p></div>';

  s += '<div class="card card-pad"><div class="sec-head"><h2>Breakpoint placement on this prompt</h2>' +
    '<span class="count">' + k.name + ' &middot; ' + k.env + '</span></div>' +
    '<div class="bp" style="margin-top:12px">' +
      '<div class="bp-row"><span class="bp-lab">automatic</span><span class="bp-track">' +
        '<span class="bp-seg" style="flex:2">tools</span><span class="bp-seg" style="flex:3">system</span>' +
        '<span class="bp-seg" style="flex:3">history</span><span class="bp-seg" style="flex:2">timestamp</span>' +
        '<span class="bp-mark" style="right:0"></span></span></div>' +
      '<div class="bp-row"><span class="bp-lab">managed</span><span class="bp-track">' +
        '<span class="bp-seg" style="flex:2">tools</span><span class="bp-seg" style="flex:3">system</span>' +
        '<span class="bp-seg" style="flex:3">history</span><span class="bp-seg" style="flex:2">timestamp</span>' +
        '<span class="bp-mark" style="left:20%"></span><span class="bp-mark" style="left:50%"></span><span class="bp-mark" style="left:80%"></span>' +
        '</span></div>' +
    '</div>' +
    '<p class="note" style="margin-top:10px">One breakpoint after the volatile tail writes the whole prefix every request and reads none of it. ' +
    'Three placed at measured boundaries leave the timestamp outside the cached region, where it belongs.</p></div>';

  s += '<div class="grid2">' +
    '<div class="card card-pad"><div class="sec-head"><h2>Projected effect</h2></div>' +
    '<div class="tw" style="margin-top:8px"><table><tbody>' +
      '<tr><td>Billed today</td><td class="num mono">' + usd(k.billed) + '</td></tr>' +
      '<tr><td>Under managed placement</td><td class="num mono" style="color:#2E7D5B">' + usd(k.ifHit) + '</td></tr>' +
      '<tr><td class="dim">Difference</td><td class="num mono dim">' + usd(k.billed - k.ifHit) + '</td></tr>' +
    '</tbody></table></div>' +
    '<p class="note" style="margin-top:10px">Projected, not measured. It assumes the shared prefix is reused once placement is correct, which is the claim the service has to earn against a per-account baseline.</p></div>' +
    '<div class="card card-pad"><div class="sec-head"><h2>How it is priced</h2></div>' +
    '<p class="sub" style="margin-top:6px"><b>Bundled into the Scale plan.</b> Uses billing that already exists, and converts self-serve accounts to contracted ones.</p>' +
    '<p class="sub"><b>Or a share of realized savings.</b> Harder to meter and to explain on an invoice, but the only version where the incentive points the same way for both sides. ' +
    'As priced today a failing cache bills more than a working one.</p></div>' +
  '</div>';

  if (on) {
    s += '<div class="banner" style="background:#EAF4EF;border-color:#C4E0D2;color:#1F5B42">' +
      '<div><b>Managed caching is on for this workspace.</b> Placement is measured against the last 24 hours of traffic and updated hourly. ' +
      'The surcharge card stays on regardless, and stays free.</div></div>';
  }
  return s;
}

/* ------------------------------------------------------------------ render */
function renderNav(){
  var s = '<button class="nav-item">Dashboard</button><button class="nav-item">API keys</button>';
  NAV.forEach(function(g){
    s += '<div class="nav-group"><div class="nav-label">' + g.label + '</div>';
    g.items.forEach(function(it){
      s += '<button class="nav-item' + (it.ours ? " active" : "") + '"' + (it.ours ? ' data-go="overview"' : "") + '>' + it.l +
        (it.badge ? '<span class="badge-beta">' + it.badge + '</span>' : "") +
        (it.dot ? '<span class="badge-dot" title="1 key paying a surcharge"></span>' : "") + '</button>';
    });
    s += '</div>';
  });
  document.getElementById("nav").innerHTML = s;
}

function render(){
  var r = route();
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    return '<button class="tab' + (t[0] === r.tab ? " active" : "") + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
  }).join("");

  var body = r.tab === "keys" ? vKeys()
    : r.tab === "diagnose" ? vDiagnose(r)
    : r.tab === "managed" ? vManaged()
    : vOverview();

  body += '<p class="foot-note"><b>Proposal, not a shipped feature.</b> The Console frame is a replica; ' +
    'Analytics &rarr; Caching is a nav entry that already exists. Every figure comes from ' +
    '<span class="mono">cache_lint.py</span> run against the seeded fixtures in this repository, so this page and the linter cannot disagree. ' +
    'Pricing multipliers are quoted from the prompt caching documentation, fetched 2 September 2026. ' +
    'Managed caching is proposed and does not exist; the projection on that tab is labelled as one.</p>';

  document.getElementById("view").innerHTML = body;
}

document.addEventListener("click", function(e){
  var tab = e.target.closest("[data-tab]");
  if (tab) { go(tab.getAttribute("data-tab")); return; }
  var g = e.target.closest("[data-go]");
  if (g) { go(g.getAttribute("data-go")); return; }
  var row = e.target.closest("[data-key]");
  if (row) { go("diagnose", row.getAttribute("data-key")); return; }
  if (e.target.id === "dismiss") { window.__dismissed = true; render(); return; }
  if (e.target.id === "mtoggle") { window.__managed = !window.__managed; render(); return; }
  if (e.target.id === "copy") {
    var snip = 'client.beta.messages.create(\n    model="claude-sonnet-5",\n    betas=["cache-diagnosis-2026-04-07"],\n    diagnostics={"previous_message_id": prev_id},\n)';
    if (navigator.clipboard) navigator.clipboard.writeText(snip);
    var c = document.getElementById("copied");
    if (c) { c.textContent = "Copied"; setTimeout(function(){ if (c) c.textContent = ""; }, 1600); }
  }
});

window.addEventListener("hashchange", render);
renderNav();
render();
</script>
