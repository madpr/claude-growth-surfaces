<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migrate from OpenAI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* A drivable terminal. Type the commands; the flow responds.
   Single surface, deliberately: this is a terminal, and a terminal is dark on
   any desktop. Every color is painted explicitly so the page holds on either
   host ground. */
:root{
  --term:#111010; --edge:#302B26; --panel:#1A1815;
  --txt:#E9E5DD; --dim:#7E786D; --faint:#4E4941;
  --ok:#74AE8D; --warn:#DCA646; --stop:#D97757; --new:#E08A66;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--term); color:var(--txt);
  font-family:var(--mono); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
#screen{
  position:relative; height:100%; overflow-y:auto; padding:32px 40px 88px;
  max-width:1560px; margin:0 auto; cursor:text;
}
@media(max-width:820px){
  body{font-size:14px}
  #screen{padding:20px 16px 124px}
}
#out{white-space:pre-wrap; word-break:break-word}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.stop{color:var(--stop)} .new{color:var(--new)}
.b{font-weight:700;color:#fff}

.line{display:flex; gap:8px; align-items:baseline}
.ps{color:var(--ok); flex:none}
#typed{white-space:pre-wrap; word-break:break-word}
#ghost{color:var(--faint)}
.cur{
  display:inline-block; width:.58em; height:1.1em; background:var(--txt);
  vertical-align:-.18em; animation:bl 1.1s steps(1) infinite;
}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cur{animation:none}}
.hide{display:none}
#out a{color:var(--new);text-decoration:underline;text-underline-offset:3px}
#out a:hover{color:#fff}
#out a.go{font-weight:700}
#typed.q{color:var(--faint)}
/* Real focusable input, visually absent. Keeps a mobile keyboard available and
   catches text inserted without per-character keydown events. #screen is its
   containing block, so it scrolls with the output instead of stretching the
   document and pulling the window down on every keystroke. */
#kb{
  position:absolute; width:1px; height:1px; opacity:0; padding:0; border:0;
  background:transparent; color:transparent; outline:none; font:inherit;
}

.opt{padding-left:2px}
.opt.sel{color:#fff}
.opt.sel .mk{color:var(--new)}
.mk{color:transparent}

.hint{
  position:fixed; left:0; right:0; bottom:0; text-align:center;
  padding:11px 16px 12px; font-size:12.5px; color:var(--faint);
  background:linear-gradient(transparent,var(--term) 40%); pointer-events:none;
}
kbd{
  font:inherit; font-size:12px; color:var(--dim);
  border:1px solid var(--edge); border-radius:3px; padding:1px 5px;
}
.foot{
  margin:8px auto 0; max-width:880px; font-size:11.5px; line-height:1.5;
  color:var(--faint);
}
.foot b{color:var(--dim);font-weight:500}
.foot code{font:inherit;color:var(--dim)}
</style>

<div id="screen"><div id="out"></div><div class="line" id="prompt"><span class="ps">&gt;</span><span><span id="typed"></span><span id="ghost"></span><span class="cur" id="cur"></span></span></div><input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input"></div>
<div class="hint"><div><kbd>&#8593;</kbd><kbd>&#8595;</kbd> history &nbsp; <kbd>Tab</kbd> complete &nbsp; <kbd>Enter</kbd> run</div>
<p class="foot"><b>Proposal, not a shipped feature.</b> /migrate-from-openai is proposed; the scenario is seeded, no repository is read, and no API is called.</p></div>

<script>
var out=document.getElementById('out'), screenEl=document.getElementById('screen'),
    typedEl=document.getElementById('typed'), ghostEl=document.getElementById('ghost'),
    promptEl=document.getElementById('prompt'), curEl=document.getElementById('cur');

var buf='', hist=[], hp=-1, mode='shell', menu=null, onValue=null;

/* The seeded scenario: 11 files, 38 call sites, 33 rewritten without asking, 5 held behind
   two decisions, 12 tests of which 10 pass on OpenAI today. */
var REPO='acme/support-triage', FILES=11, SITES=38, REWRITTEN=33, HELD=5, PR=142;
var TESTS={total:12, openai:10, claude:9, validated:12};
var REGRESSED=['tc_006','tc_007','tc_010'];

/* The two decisions. `i` holds the latest answer; --redo asks both again. */
var D=[
  {k:'response_format.json_schema', n:3,
   why:'not expressible natively: minimum, maxLength, maxItems',
   fails:REGRESSED,
   opts:[{t:'Validate after parsing', fx:'recovers '+REGRESSED.length+' tests'},
         {t:'Drop the bounds',        fx:'leaves '+REGRESSED.length+' failing'}],
   i:null},
  {k:'assistant prefill', n:2,
   why:'rejected by target model: 400 on claude-sonnet-5',
   fails:[],
   opts:[{t:'output_config.format', fx:'schema enforced'},
         {t:'System instruction',   fx:'no schema guarantee'}],
   i:null}
];
/* Whether the skill has run once. --redo needs decisions to change. */
var ran=false;
/* Keys typed while a step animation runs. Replayed when it ends. */
var pending=[];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function w(html){out.innerHTML+=html+'\n'; screenEl.scrollTop=screenEl.scrollHeight}
function nl(){w('')}

var CMDS=['/migrate-from-openai','/migrate-from-openai --redo','clear','help'];

function complete(p){
  if(!p) return '';
  for(var i=0;i<CMDS.length;i++) if(CMDS[i].indexOf(p)===0) return CMDS[i].slice(p.length);
  return '';
}
function draw(){
  if(mode==='run'){
    typedEl.className='q';
    typedEl.textContent=pending.filter(function(k){return k.length===1}).join('');
    ghostEl.textContent='';
    return;
  }
  typedEl.className='';
  typedEl.textContent=buf;
  ghostEl.textContent = mode==='shell' ? complete(buf) : '';
}

/* ---- commands ---------------------------------------------------------- */

function pad(s,n){ s=String(s); while(s.length<n) s+=' '; return s; }
function lpad(s,n){ s=String(s); while(s.length<n) s=' '+s; return s; }
function dots(list){ return list.join(' &middot; '); }

function cmdHelp(){
  w('');
  w('  <span class="dim">/migrate-from-openai</span>         rewrite the call sites, then gate the pull request on your tests');
  w('  <span class="dim">/migrate-from-openai --redo</span>  change a decision and run the check again');
  w('  <span class="dim">clear</span>                        clear the screen');
  w('');
}

function cmdMigrate(){
  w('');
  step('scanning ~/support-triage',function(){
    w('');
    w('  <span class="b">'+esc(REPO)+'</span> <span class="dim">&middot; '+FILES+' files &middot; '+SITES+' places you call OpenAI</span>');
    w('');
    row('<span class="ok">&#10003;</span>',   'rewritten',   REWRITTEN, 'client, tools, system messages, stop, cache_control');
    row('<span class="warn">&#9679;</span>',  'needs you',   HELD,      'two decisions, below');
    row('<span class="ok">&#10003;</span>',   'tests today', TESTS.openai+'/'+TESTS.total, 'on OpenAI');
    w('');
    w('  <span class="warn">Two decisions cover the '+HELD+' sites. The rewrite waits on both.</span>');
    w('');
    decide(0,false);
  });
}
function row(mark,label,count,tail){
  w('  '+mark+' '+pad(label,13)+lpad(count,5)+'  <span class="dim">'+tail+'</span>');
}

function cmdRedo(){
  if(!ran){
    w('  <span class="stop">Nothing to redo yet.</span> <span class="dim">Run /migrate-from-openai first.</span>');
    w('');
    return;
  }
  mode='run';
  w('');
  w('  <span class="warn">Deciding the '+HELD+' held sites again. The other '+REWRITTEN+' stay as rewritten.</span>');
  w('');
  decide(0,true);
}

/* ---- the decisions ----------------------------------------------------- */

function decide(i,redo){
  if(i>=D.length) return finish(redo);
  var d=D[i];
  ask('<span class="dim">held</span>  '+esc(d.k)+'  <span class="dim">'+d.n+' sites</span>',
      d.opts,
      function(c){ d.i=c; decide(i+1,redo); },
      ['      <span class="dim">'+d.why+'</span>',
       '      <span class="dim">failing on Claude:</span> '
         +(d.fails.length ? '<span class="stop">'+dots(d.fails)+'</span>' : '<span class="dim">none</span>')]);
}

function step(label,next){
  w('  <span class="dim">&middot; '+label+'&hellip;</span>');
  setTimeout(next,340);
}

function finish(redo){
  step('rewriting '+(redo?HELD:SITES)+' sites',function(){
  step('running your tests against Claude',function(){
    var pass = D[0].i===0;
    var n = pass ? TESTS.validated : TESTS.claude;
    w('');
    if(pass){
      w('  <span class="ok">&#10003; '+n+'/'+TESTS.total+' on Claude</span>   <span class="dim">was '+TESTS.openai+'/'+TESTS.total+' on OpenAI</span>');
      w('  <span class="ok">&#10003;</span> pull request #'+PR+'   <span class="dim">check:</span> <span class="ok">parity passed &middot; merge unblocked</span>');
    } else {
      w('  <span class="stop">&#10007; '+n+'/'+TESTS.total+' on Claude</span>   <span class="dim">was '+TESTS.openai+'/'+TESTS.total+' on OpenAI</span>');
      w('  <span class="stop">&#10007;</span> pull request #'+PR+'   <span class="dim">check:</span> <span class="stop">parity failed &middot; merge blocked by '+dots(REGRESSED)+'</span>');
    }
    w('');
    ran=true;
    done();
  });});
}

function done(){
  w('  <span class="faint">run </span><span class="dim">/migrate-from-openai --redo</span><span class="faint"> to change a decision</span>');
  w('');
  mode='shell';
  replay();
}

/* ---- prompts ----------------------------------------------------------- */

var OPTW=25;
function optLabel(o){ return typeof o==='string' ? o : o.t; }
function optLine(o){ return typeof o==='string' ? o : pad(o.t,OPTW)+'<span class="dim">'+o.fx+'</span>'; }

function ask(q,opts,cb,detail){
  mode='menu';
  menu={q:q,opts:opts,i:0,cb:cb,detail:detail||[],anchor:out.innerHTML};
  paintMenu();
}
function paintMenu(){
  out.innerHTML=menu.anchor;
  w('  '+menu.q);
  menu.detail.forEach(function(d){ w('  '+d); });
  menu.opts.forEach(function(o,i){
    w('  <span class="opt'+(i===menu.i?' sel':'')+'"><span class="mk">'+(i===menu.i?'&#10095;':' ')+'</span> '+optLine(o)+'</span>');
  });
  promptEl.classList.add('hide');
}
function chooseMenu(){
  var m=menu; menu=null; mode='run';
  out.innerHTML=m.anchor;
  w('  '+m.q+'  <span class="new">'+optLabel(m.opts[m.i])+'</span>');
  m.detail.forEach(function(d){ w('  '+d); });
  w('');
  promptEl.classList.remove('hide');
  m.cb(m.i);
}

var valueLabel='', valueEmpty='';
function value(label,cb,emptyLabel){
  mode='value'; onValue=cb; valueLabel=label||''; valueEmpty=emptyLabel||'(empty)'; setBuf('');
  document.querySelector('#prompt .ps').textContent=label||'>';
  promptEl.classList.remove('hide');
  draw();
}
function submitValue(){
  var v=buf.trim(); setBuf('');
  document.querySelector('#prompt .ps').textContent='>';
  var cb=onValue; onValue=null; mode='run';
  w('  <span class="dim">'+esc(valueLabel)+(v?esc(v):'<span class="faint">'+valueEmpty+'</span>')+'</span>');
  cb(v);
}

/* ---- shell ------------------------------------------------------------- */

function run(line){
  var c=line.trim().replace(/\s+/g,' ');
  w('<span class="ok">&gt;</span> '+esc(c));
  if(!c) return;
  hist.push(c); hp=hist.length;
  if(c==='clear'){ out.innerHTML=''; boot(true); return; }
  if(c==='help'){ return cmdHelp(); }
  if(c==='/migrate-from-openai'){ mode='run'; return cmdMigrate(); }
  if(c==='/migrate-from-openai --redo'){ return cmdRedo(); }
  w('  <span class="stop">'+esc(c.split(' ')[0])+': not a command here.</span> <span class="dim">Try /migrate-from-openai or help.</span>');
  w('');
}

var kb=document.getElementById('kb');
function focusKb(){ try{ kb.focus({preventScroll:true}); }catch(err){ kb.focus(); } }
function setBuf(v){ buf=v; kb.value=v; draw(); }

/* Text arrives through the input, so pasted and inserted text work too. */
kb.addEventListener('input',function(){
  if(mode==='menu'){ kb.value=''; return; }
  if(mode==='run'){
    kb.value.split('').forEach(function(c){ pending.push(c); });
    kb.value=''; draw(); return;
  }
  buf=kb.value; draw();
});

/* Keys pressed while a step chain runs are queued, shown faint at the prompt,
   and replayed when the chain ends, so nothing typed is lost. */
function replay(){
  while(pending.length&&mode!=='run'){
    var k=pending.shift();
    if(mode==='shell'||mode==='value'){
      if(k.length===1){ setBuf(buf+k); continue; }
      if(k==='Backspace'){ setBuf(buf.slice(0,-1)); continue; }
    }
    handleKey({key:k,preventDefault:function(){}});
  }
  draw();
}

kb.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  handleKey(e);
});

function handleKey(e){
  if(mode==='menu'){
    e.preventDefault();
    if(e.key==='ArrowUp'){ menu.i=(menu.i+menu.opts.length-1)%menu.opts.length; paintMenu(); }
    else if(e.key==='ArrowDown'){ menu.i=(menu.i+1)%menu.opts.length; paintMenu(); }
    else if(e.key==='Enter'){ chooseMenu(); }
    else if(/^[1-9]$/.test(e.key)){ var n=+e.key-1; if(n<menu.opts.length){ menu.i=n; chooseMenu(); } }
    return;
  }
  if(mode==='run'){
    e.preventDefault();
    var k=e.key;
    if(k==='Backspace'){
      if(pending.length&&pending[pending.length-1].length===1) pending.pop(); else pending.push(k);
    }
    else if(k.length===1||k==='Enter'||k==='Tab'||k==='ArrowUp'||k==='ArrowDown') pending.push(k);
    draw(); return;
  }

  if(e.key==='Enter'){
    e.preventDefault();
    if(mode==='value') return submitValue();
    var l=buf; setBuf(''); run(l);
  }
  else if(e.key==='Tab'){ e.preventDefault(); setBuf(buf+complete(buf)); }
  else if(e.key==='ArrowUp'&&mode==='shell'){ e.preventDefault(); if(hp>0){ hp--; setBuf(hist[hp]); } }
  else if(e.key==='ArrowDown'&&mode==='shell'){
    e.preventDefault();
    if(hp<hist.length-1){ hp++; setBuf(hist[hp]); } else { hp=hist.length; setBuf(''); }
  }
}

screenEl.addEventListener('mousedown',function(e){
  if(window.getSelection().toString()) return;   /* let people copy text */
  e.preventDefault(); focusKb();
});
kb.addEventListener('blur',function(){ setTimeout(focusKb,0); });

function boot(quiet){
  if(!quiet){
    w('<span class="dim">Claude Code 2.1.259 &middot; ~/support-triage</span>');
    w('');
    w('<span class="faint">A drivable mock of a migration skill that does not ship.</span>');
    w('<span class="faint">Type </span><span class="dim">/migrate-from-openai</span><span class="faint"> to start, or </span><span class="dim">help</span><span class="faint">.</span>');
  }
  w('');
  mode='shell'; setBuf(''); focusKb();
}
boot(false);
</script>
