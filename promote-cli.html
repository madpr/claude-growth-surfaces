<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promote from Claude Code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* A drivable terminal. Type the commands; the flow responds.
   Single surface, deliberately: this is a terminal, and a terminal is dark on
   any desktop. Every colour is painted explicitly so the page holds on either
   host ground. */
:root{
  --term:#111010; --edge:#302B26; --panel:#1A1815;
  --txt:#E9E5DD; --dim:#7E786D; --faint:#4E4941;
  --ok:#74AE8D; --warn:#DCA646; --stop:#D97757; --new:#E08A66;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--term); color:var(--txt);
  font-family:var(--mono); font-size:13px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
#screen{
  height:100%; overflow-y:auto; padding:22px 24px 30px;
  max-width:1000px; margin:0 auto; cursor:text;
}
#out{white-space:pre-wrap; word-break:break-word}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.stop{color:var(--stop)} .new{color:var(--new)}
.b{font-weight:700;color:#fff}

.line{display:flex; gap:8px; align-items:baseline}
.ps{color:var(--ok); flex:none}
#typed{white-space:pre-wrap; word-break:break-word}
#ghost{color:var(--faint)}
.cur{
  display:inline-block; width:7.5px; height:15px; background:var(--txt);
  vertical-align:-3px; animation:bl 1.1s steps(1) infinite;
}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cur{animation:none}}
.hide{display:none}
#out a{color:var(--new);text-decoration:underline;text-underline-offset:3px}
#out a:hover{color:#fff}
/* Real focusable input, visually absent. Keeps a mobile keyboard available and
   catches text inserted without per-character keydown events. */
#kb{
  position:absolute; width:1px; height:1px; opacity:0; padding:0; border:0;
  background:transparent; color:transparent; outline:none; font:inherit;
}

.opt{padding-left:2px}
.opt.sel{color:#fff}
.opt.sel .mk{color:var(--new)}
.mk{color:transparent}

.hint{
  position:fixed; left:0; right:0; bottom:0; text-align:center;
  padding:9px; font-size:11px; color:var(--faint);
  background:linear-gradient(transparent,var(--term) 55%); pointer-events:none;
}
kbd{
  font:inherit; font-size:10.5px; color:var(--dim);
  border:1px solid var(--edge); border-radius:3px; padding:0 4px;
}
</style>

<div id="screen"><div id="out"></div><div class="line" id="prompt"><span class="ps">&gt;</span><span><span id="typed"></span><span id="ghost"></span><span class="cur" id="cur"></span></span></div><input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input"></div>
<div class="hint"><kbd>&#8593;</kbd><kbd>&#8595;</kbd> history &nbsp; <kbd>Tab</kbd> complete &nbsp; <kbd>Enter</kbd> run</div>

<script>
var out=document.getElementById('out'), screenEl=document.getElementById('screen'),
    typedEl=document.getElementById('typed'), ghostEl=document.getElementById('ghost'),
    promptEl=document.getElementById('prompt'), curEl=document.getElementById('cur');

var buf='', hist=[], hp=-1, mode='shell', menu=null, onValue=null;

/* The project. Values match prototype/fixtures/ledger-reconcile, and the rule
   list is what promote.py reports as unable to cross. */
var RULES=[
  {k:'deny ', r:'Write(ledger/**)', fix:'mount ledger/ read-only', set:false},
  {k:'deny ', r:'Bash(rm *)',       fix:'nothing to protect &mdash; the sandbox is discarded after every run', set:false},
  {k:'allow', r:'Bash(python3 reconcile.py *)', fix:null,
   why:'the sandbox runs any command. Narrow it in the image, or accept it.'},
  {k:'mcp  ', r:'local-fs-index',   fix:null,
   why:'runs from your machine. Publish it as an endpoint, or drop it.'}
];
var cap=null, sched=null;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function w(html){out.innerHTML+=html+'\n'; screenEl.scrollTop=screenEl.scrollHeight}
function nl(){w('')}

var CMDS=['claude agents','claude promote','clear','help'];

function complete(p){
  if(!p) return '';
  for(var i=0;i<CMDS.length;i++) if(CMDS[i].indexOf(p)===0) return CMDS[i].slice(p.length);
  return '';
}
function draw(){
  typedEl.textContent=buf;
  ghostEl.textContent = mode==='shell' ? complete(buf) : '';
}

/* ---- commands ---------------------------------------------------------- */

function cmdAgents(){
  w('');
  w('  <span class="dim">ON THIS MACHINE</span>');
  w('  <span class="ok">&#9679;</span> 2 running                        <span class="dim">claude attach &lt;id&gt;</span>');
  w('    <span class="dim">fix-flaky-tests      12m   waiting on tests</span>');
  w('    <span class="dim">docs-sweep           4h    idle</span>');
  w('');
  w('  <span class="new">HOSTED</span>                              <span class="dim">runs when you are not here</span>');
  w('  <span class="faint">&#9675;</span> <span class="dim">none yet</span>                          <span class="new">claude promote</span>');
  w('');
}

function cmdHelp(){
  w('');
  w('  <span class="dim">claude agents</span>     local sessions, and hosted ones');
  w('  <span class="dim">claude promote</span>    turn this project into a hosted agent');
  w('  <span class="dim">clear</span>             clear the screen');
  w('');
}

function cmdPromote(){
  w('');
  w('  <span class="b">ledger-reconcile</span> <span class="dim">&middot; nightly revenue reconciliation</span>');
  w('');
  w('  <span class="ok">&#10003;</span> carries over    <span class="dim">model, instructions, tools, 1 skill, 1 service</span>');
  w('  <span class="warn">&#9679;</span> needs you       <span class="dim">what this agent is for, in one line</span>');
  w('  <span class="warn">&#9679;</span> does not carry  <span class="dim">3 rules, 1 local service</span>');
  w('');
  w('  <span class="warn">Three rules keep this agent in its lane on your machine.</span>');
  w('  <span class="warn">A hosted sandbox enforces none of them.</span>');
  w('');
  ask('Set sandbox limits now?',
      ['Yes &mdash; walk me through them','No &mdash; the agent runs unrestricted'],
      function(i){ i===0 ? rule(0) : bail(); });
}

function bail(){
  w('');
  w('  <span class="stop">Nothing replaces the rules you had.</span> The agent will run every');
  w('  <span class="stop">night with no limit on what it can reach.</span>');
  w('');
  ask('Continue anyway?',['Go back','Create it unrestricted'],function(i){
    if(i===0){ w(''); rule(0); return; }
    w(''); w('  <span class="stop">&#9679;</span> unrestricted <span class="dim">&middot; no sandbox rules, no cap</span>'); w('');
    askCap();
  });
}

/* ---- the rules --------------------------------------------------------- */

function rule(i){
  if(i>=RULES.length){ residue(); return; }
  var r=RULES[i];
  if(!r.fix) return rule(i+1);
  w('  <span class="dim">'+r.k+'</span>  '+esc(r.r));
  ask('   &#8594; '+r.fix,
      ['Accept','Skip &mdash; leave it unenforced'],
      function(c){
        r.set = c===0;
        w('  '+(c===0
            ? '<span class="ok">&#10003;</span> <span class="dim">'+r.fix+'</span>'
            : '<span class="warn">&#9675;</span> <span class="warn">unenforced</span>'));
        w('');
        rule(i+1);
      });
}

function residue(){
  var left=RULES.filter(function(r){return !r.fix});
  w('  <span class="warn">These have no sandbox equivalent.</span>');
  w('');
  left.forEach(function(r){
    w('  <span class="dim">'+r.k+'</span>  '+esc(r.r));
    w('        <span class="warn">&#8594;</span> <span class="dim">'+r.why+'</span>');
  });
  w('');
  askCap();
}

/* ---- cap, schedule, org ------------------------------------------------ */

function askCap(){
  w('  <span class="new">Spend cap</span> <span class="dim">per run, in dollars.</span>');
  w('  <span class="dim">A run started without a cap can be killed, but never capped.</span>');
  w('  <span class="dim">This is the only time it can be set.</span>');
  value('$ ', function(v){
    var n=parseFloat(v);
    if(!v){ cap=null; w('  <span class="warn">&#9675;</span> <span class="warn">no cap &mdash; this run can never be capped later</span>'); }
    else if(isNaN(n)||n<=0){ w('  <span class="stop">Not a number. Enter a dollar amount, or press Enter to skip.</span>'); return askCap(); }
    else { cap=n.toFixed(2); w('  <span class="ok">&#10003;</span> <span class="dim">$'+cap+' per run</span>'); }
    w('');
    askSched();
  });
}

function askSched(){
  w('  <span class="new">Schedule</span>');
  w('  <span class="dim">CLAUDE.md says &ldquo;every night&rdquo;. That is not a time.</span>');
  value('', function(v){
    sched=v||null;
    w(v ? '  <span class="ok">&#10003;</span> <span class="dim">'+esc(v)+'</span>'
        : '  <span class="warn">&#9675;</span> <span class="warn">no schedule &mdash; it will only run when you start it</span>');
    w('');
    org();
  });
}

function org(){
  w('  <span class="warn">This creates an agent, a sandbox and a schedule in your platform</span>');
  w('  <span class="warn">organization &mdash; not the account signed in here.</span>');
  w('');
  ask('Sign in there and create?',['Open browser','Cancel'],function(i){
    if(i===1){ w(''); w('  <span class="dim">Cancelled. Nothing was created.</span>'); w(''); return done(); }
    w('');
    step('opening browser',function(){
    step('signing in to platform organization',function(){
      w('');
      w('  <span class="new">&#8594;</span> <a href="promote-to-agent.html">confirm in the browser</a>'
        +' <span class="faint">&mdash; the other half of this flow</span>');
      w('');
      step('waiting for confirmation',function(){
      step('creating agent',function(){
      step('creating sandbox',function(){
      step('creating schedule',function(){ created(); });});});});});});
  });
}

function step(label,next){
  w('  <span class="dim">&middot; '+label+'&hellip;</span>');
  setTimeout(next,340);
}

function created(){
  var kept=RULES.filter(function(r){return r.set}).length,
      unen=RULES.filter(function(r){return r.fix&&!r.set}).length,
      none=RULES.filter(function(r){return !r.fix}).length;
  w('');
  w('  <span class="ok">&#10003; agent created</span>');
  w('');
  w('  <span class="dim">sandbox    </span>'+(kept?'<span class="ok">'+kept+' rule'+(kept>1?'s':'')+' enforced</span>':'<span class="warn">nothing enforced</span>')
    +(unen?'<span class="dim">, </span><span class="warn">'+unen+' skipped</span>':'')
    +'<span class="dim">, </span><span class="warn">'+none+' with no equivalent</span>');
  w('  <span class="dim">cap        </span>'+(cap?'<span class="ok">$'+cap+' per run</span>':'<span class="stop">none &mdash; cannot be added later</span>'));
  w('  <span class="dim">schedule   </span>'+(sched?'<span class="ok">'+esc(sched)+'</span>':'<span class="warn">none</span>'));
  w('');
  if(!cap) w('  <span class="stop">This agent can be killed. It cannot be capped.</span>');
  if(none) w('  <span class="dim">'+none+' thing'+(none>1?'s':'')+' you relied on locally '+(none>1?'are':'is')+' not enforced anywhere.</span>');
  w('');
  done();
}

function done(){
  RULES.forEach(function(r){r.set=false}); cap=null; sched=null;
  w('  <span class="faint">run</span> <span class="dim">claude promote</span> <span class="faint">again to try different answers</span>');
  w('');
  mode='shell';
}

/* ---- prompts ----------------------------------------------------------- */

function ask(q,opts,cb){
  mode='menu';
  menu={q:q,opts:opts,i:0,cb:cb,anchor:out.innerHTML};
  paintMenu();
}
function paintMenu(){
  out.innerHTML=menu.anchor;
  w('  '+menu.q);
  menu.opts.forEach(function(o,i){
    w('  <span class="opt'+(i===menu.i?' sel':'')+'"><span class="mk">'+(i===menu.i?'&#10095;':' ')+'</span> '+o+'</span>');
  });
  promptEl.classList.add('hide');
}
function chooseMenu(){
  var m=menu; menu=null; mode='run';
  out.innerHTML=m.anchor;
  w('  '+m.q+'  <span class="new">'+m.opts[m.i]+'</span>');
  w('');
  promptEl.classList.remove('hide');
  m.cb(m.i);
}

function value(label,cb){
  mode='value'; onValue=cb; setBuf('');
  document.querySelector('#prompt .ps').textContent=label||'>';
  promptEl.classList.remove('hide');
  draw();
}
function submitValue(){
  var v=buf.trim(); setBuf('');
  document.querySelector('#prompt .ps').textContent='>';
  var cb=onValue; onValue=null; mode='run';
  w('  <span class="dim">'+(v?esc(v):'(skipped)')+'</span>');
  cb(v);
}

/* ---- shell ------------------------------------------------------------- */

function run(line){
  var c=line.trim();
  w('<span class="ok">&gt;</span> '+esc(c));
  if(!c) return;
  hist.push(c); hp=hist.length;
  if(c==='clear'){ out.innerHTML=''; boot(true); return; }
  if(c==='help'){ return cmdHelp(); }
  if(c==='claude agents'){ return cmdAgents(); }
  if(c==='claude promote'){ mode='run'; return cmdPromote(); }
  w('  <span class="stop">'+esc(c.split(' ')[0])+': not a command here.</span> <span class="dim">Try claude agents, claude promote, or help.</span>');
  w('');
}

var kb=document.getElementById('kb');
function focusKb(){ try{ kb.focus({preventScroll:true}); }catch(err){ kb.focus(); } }
function setBuf(v){ buf=v; kb.value=v; draw(); }

/* Text arrives through the input, so pasted and inserted text work too. */
kb.addEventListener('input',function(){
  if(mode==='menu'||mode==='run'){ kb.value=''; return; }
  buf=kb.value; draw();
});

kb.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;

  if(mode==='menu'){
    e.preventDefault();
    if(e.key==='ArrowUp'){ menu.i=(menu.i+menu.opts.length-1)%menu.opts.length; paintMenu(); }
    else if(e.key==='ArrowDown'){ menu.i=(menu.i+1)%menu.opts.length; paintMenu(); }
    else if(e.key==='Enter'){ chooseMenu(); }
    else if(/^[1-9]$/.test(e.key)){ var n=+e.key-1; if(n<menu.opts.length){ menu.i=n; chooseMenu(); } }
    return;
  }
  if(mode==='run'){ e.preventDefault(); return; }

  if(e.key==='Enter'){
    e.preventDefault();
    if(mode==='value') return submitValue();
    var l=buf; setBuf(''); run(l);
  }
  else if(e.key==='Tab'){ e.preventDefault(); setBuf(buf+complete(buf)); }
  else if(e.key==='ArrowUp'&&mode==='shell'){ e.preventDefault(); if(hp>0){ hp--; setBuf(hist[hp]); } }
  else if(e.key==='ArrowDown'&&mode==='shell'){
    e.preventDefault();
    if(hp<hist.length-1){ hp++; setBuf(hist[hp]); } else { hp=hist.length; setBuf(''); }
  }
});

screenEl.addEventListener('mousedown',function(e){
  if(window.getSelection().toString()) return;   /* let people copy text */
  e.preventDefault(); focusKb();
});
kb.addEventListener('blur',function(){ setTimeout(focusKb,0); });

function boot(quiet){
  if(!quiet){
    w('<span class="dim">Claude Code 2.1.259 &middot; ~/ledger-reconcile</span>');
    w('');
    w('<span class="faint">A drivable mock of a promotion path that does not ship.</span>');
    w('<span class="faint">Type </span><span class="dim">claude agents</span><span class="faint"> to start, or </span><span class="dim">help</span><span class="faint">.</span>');
  }
  w('');
  mode='shell'; setBuf(''); focusKb();
}
boot(false);
</script>
